services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supertrader
      POSTGRES_USER: supertrader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supertrader_dev}
    volumes:
      - super-trader-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertrader -d supertrader"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/supertrader
      DB_USERNAME: supertrader
      DB_PASSWORD: ${DB_PASSWORD:-supertrader_dev}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  analysis:
    build: ./analysis
    ports:
      - "8001:8001"
    restart: unless-stopped

  market-data:
    build: ./market-data
    environment:
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    ports:
      - "8002:8002"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_MARKET_API_BASE_URL: http://localhost:8002
      VITE_ANALYSIS_API_BASE_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - analysis
      - market-data
    restart: unless-stopped

volumes:
  super-trader-postgres:
